# Yerel geliştirme veritabanı (MIMARI.md §11: "Docker ile PostgreSQL")
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: qrmenu
      POSTGRES_PASSWORD: qrmenu
      POSTGRES_DB: qrmenu
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  # Yerel SMTP: gönderilen e-postalar http://localhost:8025 adresinde görünür
  mail:
    image: axllent/mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  db-data:
