<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Dil seçimi</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:"Geist",system-ui,sans-serif}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; font-family: 'Geist', system-ui, sans-serif; color: #1B1B19">
  <dc-import name="Main" hint-size="390px,844px"></dc-import>
  <div style="position: absolute; left: 0; top: 0; width: 390px; height: 844px; background: rgba(18, 18, 17, 0.5)"></div>
  <section role="dialog" aria-label="Dil seçimi" style="position: absolute; left: 0; bottom: 0; width: 390px; box-sizing: border-box; background: #FFFFFF; border-radius: 24px 24px 0 0; padding: 10px 20px 32px; display: flex; flex-direction: column; gap: 12px">
    <div style="align-self: center; width: 40px; height: 5px; border-radius: 3px; background: #D6D3CC"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700">Dil / Language</h2>
      <button aria-label="Kapat" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #E4E2DC; background: #FFFFFF; color: #1B1B19; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </button>
    </div>
    <div style="display: flex; flex-direction: column">
      <sc-for list="{{langs}}" as="l" hint-placeholder-count="4">
        <a href="#" lang="{{l.code}}" style="min-height: 56px; display: flex; align-items: center; gap: 14px; text-decoration: none; color: #1B1B19; border-bottom: 1px solid #EFEDE8">
          <span style="width: 36px; height: 28px; border-radius: 6px; background: #F1EFEA; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #3E3D39">{{l.short}}</span>
          <span style="flex-grow: 1; font-size: 16px; font-weight: {{l.weight}}">{{l.name}}</span>
          <sc-if value="{{l.on}}" hint-placeholder-val="{{l.on}}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2F5D50" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-label="Seçili"><path d="m5 12 5 5 9-10"></path></svg>
          </sc-if>
        </a>
      </sc-for>
    </div>
    <p style="margin: 0; font-size: 13px; line-height: 19px; color: #5F5E59">Çevirisi olmayan ürünler Türkçe gösterilir.</p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var langs = [
      { code: 'tr', short: 'TR', name: 'Türkçe', on: true },
      { code: 'en', short: 'EN', name: 'English', on: false },
      { code: 'de', short: 'DE', name: 'Deutsch', on: false },
      { code: 'ru', short: 'RU', name: 'Русский', on: false }
    ].map(function (l) { return Object.assign({}, l, { weight: l.on ? '600' : '400' }); });
    return { langs: langs };
  }
}
</script>
</body>
</html>
