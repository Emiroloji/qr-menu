<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Menü ana ekranı — Minimal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:"Geist",system-ui,sans-serif}
a{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; background: {{c.bg}}; color: {{c.ink}}; font-family: 'Geist', system-ui, sans-serif">

  <header style="padding: 20px 20px 12px; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 52px; height: 52px; border-radius: 16px; background: {{c.accent}}; color: {{c.onAccent}}; display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 700">L</div>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <h1 style="margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.01em">Limon Kafe</h1>
        <span style="font-size: 14px; color: {{c.muted}}">Kadıköy şubesi</span>
      </div>
      <button aria-label="Dil seçimi" style="min-width: 44px; height: 44px; padding: 0 12px; border-radius: 12px; border: 1px solid {{c.line}}; background: {{c.surface}}; color: {{c.ink}}; display: flex; align-items: center; gap: 6px; font: inherit; font-size: 14px; font-weight: 600">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20"></path><path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"></path></svg>
        TR
      </button>
    </div>

    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <span style="height: 32px; padding: 0 12px; border-radius: 999px; background: {{c.surface}}; border: 1px solid {{c.line}}; display: flex; align-items: center; gap: 6px; font-size: 13px">
        <span style="width: 8px; height: 8px; border-radius: 50%; background: {{c.open}}"></span>
        Açık · 08:00–23:00
      </span>
      <button style="height: 32px; padding: 0 12px; border-radius: 999px; background: {{c.surface}}; border: 1px solid {{c.line}}; color: {{c.ink}}; display: flex; align-items: center; gap: 6px; font: inherit; font-size: 13px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5a10 10 0 0 1 14 0"></path><path d="M8.5 16a5 5 0 0 1 7 0"></path><path d="M2 9a15 15 0 0 1 20 0"></path><circle cx="12" cy="19.5" r="0.6"></circle></svg>
        Wi-Fi
      </button>
      <button style="height: 32px; padding: 0 12px; border-radius: 999px; background: {{c.surface}}; border: 1px solid {{c.line}}; color: {{c.ink}}; display: flex; align-items: center; gap: 6px; font: inherit; font-size: 13px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg>
        Adres
      </button>
      <button aria-label="Instagram" style="width: 32px; height: 32px; border-radius: 999px; background: {{c.surface}}; border: 1px solid {{c.line}}; color: {{c.ink}}; display: flex; align-items: center; justify-content: center; padding: 0">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="0.6"></circle></svg>
      </button>
    </div>

    <label style="height: 48px; border-radius: 14px; background: {{c.surface}}; border: 1px solid {{c.line}}; display: flex; align-items: center; gap: 10px; padding: 0 14px; color: {{c.muted}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input placeholder="Menüde ara" aria-label="Menüde ara" style="flex-grow: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: {{c.ink}}">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"></path><path d="M7 12h10"></path><path d="M10 18h4"></path></svg>
    </label>
  </header>

  <nav aria-label="Kategoriler" style="position: sticky; top: 0; display: flex; gap: 8px; padding: 8px 20px 12px; overflow: hidden; background: {{c.bg}}; border-bottom: 1px solid {{c.line}}">
    <sc-for list="{{cats}}" as="cat" hint-placeholder-count="4">
      <a href="#" style="flex-shrink: 0; height: 40px; padding: 0 16px; border-radius: 999px; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 600; background: {{cat.bg}}; color: {{cat.fg}}; border: 1px solid {{cat.border}}">{{cat.name}}</a>
    </sc-for>
  </nav>

  <main style="flex-grow: 1; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 4px">
    <h2 style="margin: 0 0 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Kahveler</h2>
    <sc-for list="{{products}}" as="p" hint-placeholder-count="4">
      <article style="display: flex; gap: 14px; padding: 14px 0; border-bottom: 1px solid {{c.line}}">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
          <sc-if value="{{p.hasBadge}}" hint-placeholder-val="{{true}}">
            <span style="align-self: flex-start; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: {{c.badgeBg}}; color: {{c.badgeFg}}">{{p.badge}}</span>
          </sc-if>
          <h3 style="margin: 0; font-size: 16px; font-weight: 600">{{p.name}}</h3>
          <p style="margin: 0; font-size: 14px; line-height: 20px; color: {{c.muted}}">{{p.desc}}</p>
          <div style="display: flex; align-items: center; gap: 10px; margin-top: 2px">
            <span style="font-size: 15px; font-weight: 700; text-decoration: {{p.priceDeco}}">{{p.price}}</span>
            <sc-if value="{{p.soldOut}}" hint-placeholder-val="{{false}}">
              <span style="font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; border: 1px solid {{c.ink}}">Tükendi</span>
            </sc-if>
            <span style="font-size: 12px; color: {{c.muted}}">{{p.allergenText}}</span>
          </div>
        </div>
        <div role="img" aria-label="{{p.name}} fotoğrafı" style="flex-shrink: 0; width: 96px; height: 96px; border-radius: 14px; background: {{c.photo}}; opacity: {{p.opacity}}; display: flex; align-items: center; justify-content: center; color: {{c.photoIcon}}">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><circle cx="9" cy="10" r="1.5"></circle><path d="m21 16-5-5-8 8"></path></svg>
        </div>
      </article>
    </sc-for>
    <h2 style="margin: 24px 0 8px; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Soğuk İçecekler</h2>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#2F5D50","options":["#2F5D50","#8A3B12","#1F3A8A","#6B2150"]},"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  mix(hex, target, t) {
    var h = hex.replace('#', '');
    var r = parseInt(h.slice(0, 2), 16), g = parseInt(h.slice(2, 4), 16), b = parseInt(h.slice(4, 6), 16);
    var tr = target === 'w' ? 255 : 0;
    var f = function (v) { return Math.round(v + (tr - v) * t).toString(16).padStart(2, '0'); };
    return '#' + f(r) + f(g) + f(b);
  }
  renderVals() {
    var accent = this.props.accent ?? '#2F5D50';
    var dark = this.props.dark ?? false;
    var c = dark ? {
      bg: '#121211', surface: '#1C1C1A', ink: '#F1EFEA', muted: '#A7A49D', line: '#2E2D2A',
      accent: this.mix(accent, 'w', 0.55), onAccent: '#121211', open: '#6FCF8E',
      badgeBg: '#2A2926', badgeFg: '#F1EFEA', photo: '#252422', photoIcon: '#6B6963'
    } : {
      bg: '#F7F6F3', surface: '#FFFFFF', ink: '#1B1B19', muted: '#5F5E59', line: '#E4E2DC',
      accent: accent, onAccent: '#FFFFFF', open: '#2E9D57',
      badgeBg: this.mix(accent, 'w', 0.86), badgeFg: this.mix(accent, 'k', 0.2), photo: '#EAE7E0', photoIcon: '#A19D93'
    };
    var names = ['Kahveler', 'Soğuk İçecekler', 'Tatlılar', 'Sandviçler'];
    var cats = names.map(function (n, i) {
      return i === 0
        ? { name: n, bg: c.accent, fg: c.onAccent, border: c.accent }
        : { name: n, bg: c.surface, fg: c.ink, border: c.line };
    });
    var raw = [
      { name: 'Latte', desc: 'Çift shot espresso ve buharda ısıtılmış süt.', price: '85 ₺’den', badge: 'Popüler', allergenText: 'Süt' },
      { name: 'Filtre Kahve', desc: 'Her sabah taze demlenen tek köken çekirdek.', price: '70 ₺', badge: 'Yeni', allergenText: '' },
      { name: 'Türk Kahvesi', desc: 'Közde pişirilir, lokum ile servis edilir.', price: '65 ₺', badge: 'Şefin önerisi', allergenText: '' },
      { name: 'Mocha', desc: 'Espresso, bitter çikolata sosu ve süt.', price: '105 ₺', badge: '', allergenText: 'Süt · Soya', soldOut: true }
    ];
    var products = raw.map(function (p) {
      return Object.assign({}, p, { hasBadge: !!p.badge, soldOut: !!p.soldOut, opacity: p.soldOut ? '0.4' : '1', priceDeco: p.soldOut ? 'line-through' : 'none' });
    });
    return { c: c, cats: cats, products: products, true: true, false: false };
  }
}
</script>
</body>
</html>
