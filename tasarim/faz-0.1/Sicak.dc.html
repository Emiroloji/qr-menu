<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Tema taslağı — Sıcak</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:"Nunito Sans",system-ui,sans-serif}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #FBF4E9; color: #2B1E16; font-family: 'Nunito Sans', system-ui, sans-serif; display: flex; flex-direction: column">
  <div role="img" aria-label="Kapak görseli" style="height: 150px; flex-shrink: 0; background: #EBD9C2; border-radius: 0 0 28px 28px; position: relative">
    <button aria-label="Dil seçimi" style="position: absolute; top: 14px; right: 14px; height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: #FBF4E9; color: #2B1E16; font: inherit; font-size: 14px; font-weight: 700">TR</button>
  </div>
  <header style="padding: 0 20px 14px; margin-top: -34px; display: flex; flex-direction: column; gap: 10px">
    <div style="width: 68px; height: 68px; border-radius: 50%; background: {{accent}}; border: 4px solid #FBF4E9; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-family: 'Fraunces', serif; font-size: 28px; font-weight: 700">L</div>
    <div>
      <h1 style="margin: 0; font-family: 'Fraunces', serif; font-size: 28px; font-weight: 700">Limon Kafe</h1>
      <span style="font-size: 14px; color: #6F5A4B">Kadıköy · Açık, 23:00’e kadar</span>
    </div>
    <label style="height: 48px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 10px; padding: 0 18px; color: #6F5A4B; box-shadow: 0 1px 0 rgba(43, 30, 22, 0.08)">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input placeholder="Ne canın çekiyor?" aria-label="Menüde ara" style="flex-grow: 1; border: 0; outline: 0; background: transparent; font: inherit; font-size: 15px; color: #2B1E16">
    </label>
  </header>
  <nav aria-label="Kategoriler" style="display: flex; gap: 8px; padding: 4px 20px 16px; overflow: hidden">
    <a href="#" style="flex-shrink: 0; height: 42px; padding: 0 18px; border-radius: 999px; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 700; background: {{accent}}; color: #FFFFFF">Kahveler</a>
    <a href="#" style="flex-shrink: 0; height: 42px; padding: 0 18px; border-radius: 999px; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 700; background: #F1E3CF; color: #2B1E16">Soğuk İçecekler</a>
    <a href="#" style="flex-shrink: 0; height: 42px; padding: 0 18px; border-radius: 999px; display: flex; align-items: center; text-decoration: none; font-size: 14px; font-weight: 700; background: #F1E3CF; color: #2B1E16">Tatlılar</a>
  </nav>
  <main style="padding: 0 20px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{products}}" as="p" hint-placeholder-count="4">
      <article style="background: #FFFFFF; border-radius: 20px; padding: 8px 8px 12px; display: flex; flex-direction: column; gap: 8px">
        <div role="img" aria-label="{{p.name}} fotoğrafı" style="height: 116px; border-radius: 14px; background: #EBD9C2; opacity: {{p.opacity}}; position: relative">
          <sc-if value="{{p.hasBadge}}" hint-placeholder-val="{{p.hasBadge}}">
            <span style="position: absolute; top: 8px; left: 8px; font-size: 11px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: #FFFFFF; color: #2B1E16">{{p.badge}}</span>
          </sc-if>
        </div>
        <div style="padding: 0 4px; display: flex; flex-direction: column; gap: 2px">
          <h3 style="margin: 0; font-size: 15px; font-weight: 700">{{p.name}}</h3>
          <span style="font-size: 15px; font-weight: 700; color: {{p.priceColor}}">{{p.price}}</span>
        </div>
      </article>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#B4532A","options":["#B4532A","#8C5A2B","#7A4E8C"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var accent = this.props.accent ?? '#B4532A';
    var products = [
      { name: 'Latte', price: '85 ₺’den', badge: 'Popüler' },
      { name: 'Filtre Kahve', price: '70 ₺', badge: 'Yeni' },
      { name: 'Türk Kahvesi', price: '65 ₺', badge: 'Şefin önerisi' },
      { name: 'Mocha', price: 'Tükendi', badge: '', soldOut: true }
    ].map(function (p) {
      return Object.assign({}, p, { hasBadge: !!p.badge, opacity: p.soldOut ? '0.4' : '1', priceColor: p.soldOut ? '#6F5A4B' : accent });
    });
    return { accent: accent, products: products };
  }
}
</script>
</body>
</html>
