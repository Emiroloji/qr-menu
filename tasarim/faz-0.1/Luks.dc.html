<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Tema taslağı — Lüks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Jost:wght@400;500&amp;display=swap" rel="stylesheet">
<style>body{margin:0;font-family:"Jost",system-ui,sans-serif}</style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; box-sizing: border-box; background: #15130F; color: #EDE6D8; font-family: 'Jost', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 36px 28px 20px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
    <div style="width: 56px; height: 56px; border-radius: 50%; border: 1px solid {{accent}}; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 26px; color: {{accent}}">L</div>
    <h1 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 34px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase">Limon</h1>
    <span style="font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: #B3AA99">Kadıköy · 08:00–23:00</span>
    <div style="display: flex; gap: 8px; margin-top: 6px">
      <button aria-label="Ara" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #3A352C; background: transparent; color: #EDE6D8; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button>
      <button aria-label="Dil seçimi" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #3A352C; background: transparent; color: #EDE6D8; font: inherit; font-size: 12px; letter-spacing: 0.1em; padding: 0">TR</button>
      <button aria-label="Bilgi" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #3A352C; background: transparent; color: #EDE6D8; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 11v6M12 7.5v.01"></path></svg></button>
    </div>
  </header>

  <nav aria-label="Kategoriler" style="display: flex; gap: 22px; padding: 0 28px; border-bottom: 1px solid #2B2721; overflow: hidden">
    <a href="#" style="flex-shrink: 0; min-height: 44px; display: flex; align-items: center; text-decoration: none; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: {{accent}}; border-bottom: 1px solid {{accent}}">Kahveler</a>
    <a href="#" style="flex-shrink: 0; min-height: 44px; display: flex; align-items: center; text-decoration: none; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #B3AA99">Soğuk</a>
    <a href="#" style="flex-shrink: 0; min-height: 44px; display: flex; align-items: center; text-decoration: none; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #B3AA99">Tatlılar</a>
    <a href="#" style="flex-shrink: 0; min-height: 44px; display: flex; align-items: center; text-decoration: none; font-size: 13px; letter-spacing: 0.16em; text-transform: uppercase; color: #B3AA99">Sandviçler</a>
  </nav>

  <main style="padding: 28px 28px 0; display: flex; flex-direction: column; gap: 22px">
    <h2 style="margin: 0; text-align: center; font-family: 'Cormorant Garamond', serif; font-style: italic; font-size: 26px; font-weight: 500; color: {{accent}}">Kahveler</h2>
    <sc-for list="{{products}}" as="p" hint-placeholder-count="4">
      <article style="display: flex; flex-direction: column; gap: 4px">
        <div style="display: flex; align-items: baseline; gap: 8px">
          <h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 21px; font-weight: 600; text-decoration: {{p.deco}}">{{p.name}}</h3>
          <span style="flex-grow: 1; border-bottom: 1px dotted #5A5346; transform: translateY(-4px)"></span>
          <span style="font-size: 15px; font-weight: 500; color: {{accent}}">{{p.price}}</span>
        </div>
        <p style="margin: 0; font-size: 13px; line-height: 19px; color: #B3AA99">{{p.desc}}</p>
        <span style="font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #B3AA99">{{p.meta}}</span>
      </article>
    </sc-for>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C9A96E","options":["#C9A96E","#D4B8A0","#A8B89A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var products = [
      { name: 'Latte', desc: 'Çift shot espresso ve buharda ısıtılmış süt.', price: '85 ₺’den', meta: 'Popüler · Süt' },
      { name: 'Filtre Kahve', desc: 'Her sabah taze demlenen tek köken çekirdek.', price: '70 ₺', meta: 'Yeni' },
      { name: 'Türk Kahvesi', desc: 'Közde pişirilir, lokum ile servis edilir.', price: '65 ₺', meta: 'Şefin önerisi' },
      { name: 'Mocha', desc: 'Espresso, bitter çikolata sosu ve süt.', price: 'Tükendi', meta: 'Süt · Soya', soldOut: true }
    ].map(function (p) { return Object.assign({}, p, { deco: p.soldOut ? 'line-through' : 'none' }); });
    return { accent: this.props.accent ?? '#C9A96E', products: products };
  }
}
</script>
</body>
</html>
